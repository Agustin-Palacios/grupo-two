<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sección Descuentos - Joyas</title>
    <link rel="stylesheet" href="descuentos.css">
</head>
<body>
    <section id="descuentos">
        <h1>✨💎💍 Descuentos Especiales en delmarJoyas ✨💎💍</h1>
        <p>Aprovechá nuestras ofertas limitadas en piezas únicas.</p>

        <div class="productos">
            <div class="producto">
                <img src="https://via.placeholder.com/200" alt="Anillo de plata">
                <h2>Anillo de Plata</h2>
                <p class="precio">Antes: <span class="tachado">$15.000</span></p>
                <p class="descuento">Ahora: $10.500</p>
                <button>Comprar</button>
            </div>

            <div class="producto">
                <img src="https://via.placeholder.com/200" alt="collar plata">
                <h2>Collar plata</h2>
                <p class="precio">Antes: <span class="tachado">$22.000</span></p>
                <p class="descuento">Ahora: $16.500</p>
                <button>Comprar</button>
            </div>

            <div class="producto">
                <img src="https://via.placeholder.com/200" alt="Pulsera de piedras">
                <h2>Pulsera con Piedras</h2>
                <p class="precio">Antes: <span class="tachado">$12.000</span></p>
                <p class="descuento">Ahora: $8.400</p>
                <button>Comprar</button>
            </div>
        </div>
    </section>
</body>
</html>
